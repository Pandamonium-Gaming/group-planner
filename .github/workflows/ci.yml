name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-validation-only
          POSTGRES_DB: group_planner_rehearsal_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d group_planner_rehearsal_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.15.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run linting
        run: yarn lint

      - name: Check translation sync
        run: yarn check:translations

      - name: Check changelog updates
        run: yarn check:changelog

      - name: Run tests
        run: yarn test:coverage

      - name: Verify Trial character RLS migration
        run: node --import tsx --test scripts/__tests__/trial-character-migration.test.mts
        env:
          GP_MIGRATION_TEST_DATABASE_URL: postgresql://postgres:local-ci-validation-only@127.0.0.1:5432/group_planner_rehearsal_validation

      - name: Upload coverage reports
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Enable Corepack and activate Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.15.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build application
        run: yarn build
