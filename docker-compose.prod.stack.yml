name: guild-planner-prod-stack

services:
  db:
    image: postgres:16
    container_name: guild-planner-db-prod-stack
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: group_planner
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d group_planner"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - group_planner_db_prod_stack_data:/var/lib/postgresql/data

  app:
    container_name: guild-planner-app-prod-stack
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      AUTH_DATABASE_URL: postgresql://postgres:postgres@db:5432/group_planner
      DATABASE_URL: postgresql://postgres:postgres@db:5432/group_planner

volumes:
  group_planner_db_prod_stack_data: