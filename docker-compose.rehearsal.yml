name: group-planner-rehearsal

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${REHEARSAL_DB_PASSWORD:?Set a unique local rehearsal password}
      POSTGRES_DB: group_planner_rehearsal
    ports:
      - "127.0.0.1:${REHEARSAL_DB_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d group_planner_rehearsal"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rehearsal_data:/var/lib/postgresql/data

volumes:
  rehearsal_data:
